<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Glowing Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 800; opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes floatDot {
        0%, 100% { transform: translateY(0px) scale(1); opacity: 0.7; }
        50% { transform: translateY(-8px) scale(1.15); opacity: 1; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes blinkBeacon {
        0%, 100% { opacity: 0.3; r: 4px; }
        50% { opacity: 1; r: 6.5px; }
      }
      .pulse-line {
        stroke-dasharray: 120 200;
        animation: pulseBeam 5s linear infinite;
      }
      .radar-arm {
        transform-origin: 1040px 180px;
        animation: radarSweep 8s linear infinite;
      }
      .beacon-1 { animation: blinkBeacon 2s ease-in-out infinite; }
      .beacon-2 { animation: blinkBeacon 2.5s ease-in-out infinite 0.6s; }
      .beacon-3 { animation: blinkBeacon 1.8s ease-in-out infinite 1.2s; }
      .floating-node { animation: floatDot 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="360" fill="url(#grid)" rx="16" />

  <!-- Dynamic Ambient Orbs (Background) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.06" filter="url(#glow)" />
  <circle cx="1000" cy="240" r="160" fill="#818cf8" opacity="0.07" filter="url(#glow)" />
  <circle cx="600" cy="300" r="120" fill="#10b981" opacity="0.05" filter="url(#glow)" />

  <!-- Background Synthetic Pulse Telemetry Waves (Behind text) -->
  <g opacity="0.45">
    <path d="M 0 310 Q 150 310 240 280 T 400 300 T 580 240 T 700 320 T 900 270 T 1050 310 T 1200 300" 
          fill="none" stroke="#1e293b" stroke-width="2" />
    <path class="pulse-line" d="M 0 310 Q 150 310 240 280 T 400 300 T 580 240 T 700 320 T 900 270 T 1050 310 T 1200 300" 
          fill="none" stroke="url(#accentGrad)" stroke-width="2.5" filter="url(#glow-subtle)" />
    
    <!-- Heartbeat ECG line at bottom -->
    <path d="M 0 340 L 450 340 L 470 330 L 485 355 L 500 315 L 515 348 L 525 340 L 800 340 L 820 325 L 835 350 L 850 340 L 1200 340" 
          fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" />
  </g>

  <!-- Animated Radar Graphic on Right Side -->
  <g opacity="0.6">
    <circle cx="1040" cy="180" r="100" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
    <circle cx="1040" cy="180" r="65" fill="none" stroke="#334155" stroke-width="1" />
    <circle cx="1040" cy="180" r="30" fill="none" stroke="#334155" stroke-width="1" />
    <line x1="940" y1="180" x2="1140" y2="180" stroke="#1e293b" stroke-width="1" />
    <line x1="1040" y1="80" x2="1040" y2="280" stroke="#1e293b" stroke-width="1" />
    <line class="radar-arm" x1="1040" y1="180" x2="1135" y2="150" stroke="#38bdf8" stroke-width="2" filter="url(#glow-subtle)" />
    <!-- Blinking Probes on Radar -->
    <circle class="beacon-1" cx="1080" cy="140" r="5" fill="#10b981" filter="url(#glow-subtle)" />
    <circle class="beacon-2" cx="990" cy="210" r="4" fill="#38bdf8" filter="url(#glow-subtle)" />
    <circle class="beacon-3" cx="1030" cy="120" r="4.5" fill="#c084fc" filter="url(#glow-subtle)" />
  </g>

  <!-- Foreground Content: Header Badge, Title, Subtitle, Feature Badges -->
  <g transform="translate(80, 0)">
    <!-- Top Micro Tag Pill -->
    <g transform="translate(0, 52)">
      <rect width="270" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="14" r="4.5" fill="#10b981" class="beacon-1" />
      <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" letter-spacing="0.5">
        HIGH AVAILABILITY &amp; RESILIENCE
      </text>
    </g>

    <!-- Main Title (Strictly Foregrounded & Readable) -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
      Awesome Infrastructure Monitoring
    </text>

    <!-- Subtitle -->
    <text x="0" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#f8fafc" letter-spacing="-0.2">
      &amp; Uptime Tracking
    </text>

    <!-- Descriptive Tagline -->
    <text x="0" y="215" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#94a3b8">
      Curated index of synthetic monitors, status pages, telemetry stacks &amp; heartbeat sensors.
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(0, 255)">
      <!-- Pill 1: Uptime Monitors -->
      <g transform="translate(0, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">⚡ Synthetic Probes</text>
      </g>

      <!-- Pill 2: Status Pages -->
      <g transform="translate(157, 0)">
        <rect width="138" height="34" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#34d399">🟢 Status Pages</text>
      </g>

      <!-- Pill 3: Full-Stack Suites -->
      <g transform="translate(307, 0)">
        <rect width="142" height="34" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a5b4fc">📊 Observability</text>
      </g>

      <!-- Pill 4: Heartbeats & Cron -->
      <g transform="translate(461, 0)">
        <rect width="138" height="34" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fbbf24">⏱️ Cron Tracking</text>
      </g>

      <!-- Pill 5: 99.999% SLA -->
      <g transform="translate(611, 0)">
        <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.8" />
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#f472b6">🛡️ 99.999% SLA</text>
      </g>
    </g>
  </g>

  <!-- Border Frame -->
  <rect width="1200" height="360" fill="none" stroke="#334155" stroke-width="1.5" rx="16" />
</svg>
